globals:
  - id: current_page
    type: int
    initial_value: "1"
    restore_value: true
  - id: download_finished
    type: bool
    initial_value: "false"

substitutions:
  # Dashboard URL — see .esphome-secrets.example.yaml for setup instructions
  base_url: !secret dashboard_base_url2

esphome:
  name: reterminal-e1002
  friendly_name: reTerminal_E1002
  # Move the header include here so it's at the top of the file
  includes:
    - rtc_fix.h
  on_boot:
    - priority: 600.0
      then:
        - output.turn_on: bsp_battery_enable
        - lambda: |-
            // 1. Setup Display Reset/Battery
            gpio_config_t io_conf = {};
            io_conf.mode = GPIO_MODE_OUTPUT;
            io_conf.pin_bit_mask = (1ULL << 12) | (1ULL << 21);
            gpio_config(&io_conf);
            gpio_set_level(GPIO_NUM_21, 1);
            gpio_set_level(GPIO_NUM_12, 0);
            vTaskDelay(pdMS_TO_TICKS(200)); 
            gpio_set_level(GPIO_NUM_12, 1);

            // 2. Setup RTC Pull-ups for Buttons (GPIO 2, 3, 4)
            // This ensures they are pulled HIGH even during Deep Sleep
            // #include "driver/rtc_io.h"
            rtc_gpio_init(GPIO_NUM_2);
            rtc_gpio_init(GPIO_NUM_3);
            rtc_gpio_init(GPIO_NUM_4);
            rtc_gpio_set_direction(GPIO_NUM_2, RTC_GPIO_MODE_INPUT_ONLY);
            rtc_gpio_set_direction(GPIO_NUM_3, RTC_GPIO_MODE_INPUT_ONLY);
            rtc_gpio_set_direction(GPIO_NUM_4, RTC_GPIO_MODE_INPUT_ONLY);
            rtc_gpio_pullup_en(GPIO_NUM_2);
            rtc_gpio_pullup_en(GPIO_NUM_3);
            rtc_gpio_pullup_en(GPIO_NUM_4);
            rtc_gpio_pulldown_dis(GPIO_NUM_2);
            rtc_gpio_pulldown_dis(GPIO_NUM_3);
            rtc_gpio_pulldown_dis(GPIO_NUM_4);
    - priority: -100
      then:
        # Check which button (if any) caused the wakeup and update page accordingly
        - lambda: |-
            uint64_t wakeup_status = esp_sleep_get_ext1_wakeup_status();

            if (wakeup_status & (1ULL << 4)) { // NEXT (GPIO4)
              id(current_page) = (id(current_page) >= 2) ? 1 : id(current_page) + 1;
              ESP_LOGI("main", "Confirmed Wakeup: NEXT button. Page: %d", id(current_page));
            } else if (wakeup_status & (1ULL << 2)) { // PREV (GPIO2)
              id(current_page) = (id(current_page) <= 1) ? 2 : id(current_page) - 1;
              ESP_LOGI("main", "Confirmed Wakeup: PREV button. Page: %d", id(current_page));
            } else if (wakeup_status & (1ULL << 3)) { // REFRESH (GPIO3)
              ESP_LOGI("main", "Confirmed Wakeup: REFRESH. Staying on page: %d", id(current_page));
            } else {
              ESP_LOGI("main", "Timer/Other Wakeup. Page: %d", id(current_page));
            }
        # Guy Sie's fix: wait for display hardware to fully initialize
        - delay: 5000ms
        - script.execute: refresh_and_sleep

output:
  - platform: gpio
    pin: GPIO21
    id: bsp_battery_enable

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_WIFI_ENABLE_WPA3_SAE: "y"
      CONFIG_WPA_MBEDTLS_CRYPTO: "y"

psram:
  mode: octal
  speed: 80MHz

wifi:
  # Network credentials are in a secrets file — see .esphome-secrets.example.yaml
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 100

    - ssid: !secret wifi_ssid2
      password: !secret wifi_password2
      priority: 50

  # Enable fallback hotspot so you can still reach the device if main WiFi fails
  ap:
    ssid: "reTerminal-Fallback"
    password: "YourFallbackPassword"  # Change this!

  on_connect:
    then:
      - logger.log: "WiFi connected successfully!"
      # - component.update: dashboard_image
  on_disconnect:
    then:
      - logger.log: "WiFi disconnected"

logger:
  # level: DEBUG
  # level: INFO
  level: WARN
  hardware_uart: UART0

api:
  encryption:
    key: !secret api_encryption_key  # Generate with: esphome generate encryption-key reterminal-e1002.yaml

ota:
  - platform: esphome
    password: !secret ota_password  # Choose a strong OTA password

captive_portal:

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9
  interface: hardware
  # Use a lower data rate for the initial handshake
  # data_rate: 2MHz

http_request:
  verify_ssl: false
  timeout: 4min
  watchdog_timeout: 5min
  useragent: "ESPHome/reTerminal-E1002"

time:
  - platform: sntp
    id: sntp_time
    timezone: "Europe/Amsterdam" # Adjust to your local TZ
    # on_time:
    #   - seconds: 0
    #     minutes: 0
    #     hours: 7,9,12,15,18,21
    #     then:
    #       - component.update: dashboard_image

deep_sleep:
  id: deep_sleep_control
  # Safety window - long enough for the full refresh cycle (download + 45s display delay).
  # The script calls deep_sleep.enter explicitly when done, so this is just a backstop.
  sleep_duration: 1h
  run_duration: 10min
  esp32_ext1_wakeup:
    pins:
      - GPIO2 # Previous Page button
      - GPIO3 # Refresh button
      - GPIO4 # Next Page button
    mode: ANY_LOW

script:
  - id: refresh_and_sleep
    mode: single
    then:
      # 1. Connect to WiFi and Sync Time
      - logger.log: "Waiting for WiFi and Time..."
      - wait_until:
          condition:
            - wifi.connected:
            - time.has_time:
          timeout: 90s
      - lambda: |-
          if (!id(sntp_time).now().is_valid()) {
            ESP_LOGW("main", "Time sync failed. Proceeding with default time...");
          }

      # 2. Night-time check (Only skip if it's a TIMER wakeup)
      # If a button is pressed, we likely want to see the screen regardless of time.
      # - lambda: |-
      #     auto now = id(sntp_time).now();
      #     uint64_t wakeup_status = esp_sleep_get_ext1_wakeup_status();
      #     if (wakeup_status == 0 && now.is_valid() && (now.hour >= 23 || now.hour < 7)) {
      #       ESP_LOGI("main", "Night timer wakeup. Sleeping.");
      #       id(deep_sleep_control).begin_sleep();
      #     }

      # --- FORCED BATTERY SEQUENCE ---
      - output.turn_on: bsp_battery_enable
      - delay: 200ms # Let the voltage stabilize
      - component.update: battery_voltage
      - delay: 200ms # Let the ADC result settle
      - component.update: battery_level
      - delay: 200ms # Ensure the template has the new value
      # -------------------------------

      # Update WiFi signal strength
      - component.update: wifi_rssi
      - delay: 100ms

      - lambda: |-
          id(download_finished) = false;
          std::string page_suffix = (id(current_page) == 1) ? "" : "-" + std::to_string(id(current_page));
          std::string new_url = std::string("${base_url}") + page_suffix + ".png";
          id(dashboard_image).set_url(new_url.c_str());
      - component.update: dashboard_image
      - wait_until:
          condition:
            lambda: "return id(download_finished);"
          timeout: 4min

      - lambda: |-
          if (!id(download_finished)) {
            ESP_LOGE("main", "Download timed out or failed. Skipping display update.");
            id(deep_sleep_control).begin_sleep();
          }
      - logger.log: "Download complete. Disable wifi and update display..."
      - wifi.disable:
      - delay: 1s
      - component.update: epaper_display

      # 5. Pigment settling wait
      # The E1002 Spectra 6 is power-hungry during the 30s-45s refresh.
      # If the ESP32 sleeps too early, the refresh might "ghost" or fail.
      # IMPORTANT: Wait for refresh, then "re-assert" pullups before sleeping
      - delay: 45s
      - lambda: |-
          rtc_gpio_pullup_en(GPIO_NUM_2);
          rtc_gpio_pullup_en(GPIO_NUM_3);
          rtc_gpio_pullup_en(GPIO_NUM_4);
      - logger.log: "Refresh done. Going to sleep for 3 hours."
      - lambda: |-
          auto now = id(sntp_time).now();

          if (!now.is_valid()) {
            ESP_LOGW("main", "Time not valid → fallback sleep 3h");
            id(deep_sleep_control).set_sleep_duration(3 * 3600 * 1000);
            id(deep_sleep_control).begin_sleep();
            return;
          }

          int current_hour = now.hour;
          int current_min = now.minute;
          int current_sec = now.second;

          // Your custom wake schedule
          const int schedule[] = {0, 6, 9, 12, 15, 18, 21};
          const int schedule_size = sizeof(schedule) / sizeof(schedule[0]);

          int next_hour = -1;

          // Find next scheduled hour
          for (int i = 0; i < schedule_size; i++) {
            if (schedule[i] > current_hour) {
              next_hour = schedule[i];
              break;
            }
          }

          // If none found → wrap to next day (midnight)
          if (next_hour == -1) {
            next_hour = 0;
          }

          int seconds_now = current_hour * 3600 + current_min * 60 + current_sec;
          int seconds_target = next_hour * 3600;

          int sleep_seconds = seconds_target - seconds_now;
          if (sleep_seconds <= 0) {
            sleep_seconds += 24 * 3600;
          }

          ESP_LOGI("main", "Now: %02d:%02d:%02d", current_hour, current_min, current_sec);
          ESP_LOGI("main", "Next wake at: %02d:00", next_hour);
          ESP_LOGI("main", "Sleeping for %d seconds", sleep_seconds);

          id(deep_sleep_control).set_sleep_duration(sleep_seconds * 1000);
          id(deep_sleep_control).begin_sleep();

sensor:
  - platform: adc
    pin: GPIO1
    name: "Battery Voltage"
    id: battery_voltage
    update_interval: never
    attenuation: 12db
    filters:
      - multiply: 2.0

  - platform: template
    id: battery_level
    # This takes the voltage and runs it through the Seeed calibration curve
    lambda: |-
      if (id(battery_voltage).has_state()) {
        return id(battery_voltage).state;
      }
      return 0.0;
    update_interval: never # We will control this manually
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_rssi
    update_interval: never # Managed by the script

# Page buttons (GPIO2=Prev, GPIO4=Next) are handled via esp32_ext1_wakeup.
# On boot, the wakeup status lambda detects which button was pressed and
# updates current_page before fetching the image. No binary_sensor needed.

online_image:
  - id: dashboard_image
    format: PNG
    type: RGB565
    url: "${base_url}"
    update_interval: never
    on_download_finished:
      - lambda: "id(download_finished) = true;"
    on_error:
      - logger.log: "Download failed!"

# Only needed when you are drawing
font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 10
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/ma\
      terialdesignicons-webfont.ttf"
    id: icon_font
    size: 16
    glyphs:
      - "󰤟" # mdi-wifi-strength-1
      - "󰤢" # mdi-wifi-strength-2
      - "󰤥" # mdi-wifi-strength-3
      - "󰤨" # mdi-wifi-strength-4
      - "󰤯" # mdi-wifi-strength-outline (No signal)

display:
  - platform: epaper_spi
    id: epaper_display
    model: Seeed-reTerminal-E1002
    full_update_every: 1
    update_interval: never
    # Guy Sie's recommendation for Spectra 6 stability:
    auto_clear_enabled: false
    lambda: |-
      // 1. Draw the Background Image
      if (id(dashboard_image).is_ready()) {
        // Draw the downloaded image at the top-left corner
        it.image(0, 0, id(dashboard_image));
      }

      // --- WIFI ICON LOGIC ---
      int wx = 705; // Positioned to the left of the battery text
      int wy = -2;

      const char* wifi_icon = "\U000F092F"; // Default: No signal
      if (id(wifi_rssi).has_state()) {
        float rssi = id(wifi_rssi).state;
        if (rssi >= -60) wifi_icon = "\U000F0928";      // 4 bars
        else if (rssi >= -70) wifi_icon = "\U000F0925"; // 3 bars
        else if (rssi >= -80) wifi_icon = "\U000F0922"; // 2 bars
        else if (rssi >= -90) wifi_icon = "\U000F091F"; // 1 bar
      }
      it.print(wx, wy, id(icon_font), Color::BLACK, wifi_icon);

      // 2. The Micro Battery Icon (Top Right: 775, 2)
      // We don't draw a background box, just the icon itself
      int x = 765; // X position
      int y = 0;   // Y position
      int w = 20;  // Width
      int h = 10;  // Height

      // Draw battery outline (Black)
      it.rectangle(x, y, w, h, Color::BLACK);
      it.filled_rectangle(x + w, y + 3, 2, 4, Color::BLACK); // The "nub"

      // Calculate fill based on the template sensor
      float pct = id(battery_level).state;
      if (std::isnan(pct)) pct = 0.0;
      int fill_w = (int)((pct / 100.0) * (w - 4));

      // If pct is 0, let's draw at least 1 pixel so we know the code is running
      if (fill_w < 1 && pct >= 0) fill_w = 1;

      // Determine color: Red if < 20%, otherwise Black (or Green if you prefer)
      Color batt_color = (pct < 20.0) ? Color(255, 0, 0) : Color::BLACK;

      if (fill_w > 0) {
        it.filled_rectangle(x + 2, y + 2, fill_w, h - 4, batt_color);
      }
      // Add the percentage text (requires a font, see below)
      it.printf(x - 30, 0, id(font_small), Color::BLACK, "%d%%", (int)pct);
