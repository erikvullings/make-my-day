# ESPHome Secrets File (place this alongside your .yaml file or in your ESPHome config dir)
#
# ESPHome uses `!secret` references that are resolved from files named `secrets.yaml`
# in the same directory as your device YAML, or from the global ESPHome secrets path.
#
# How to create one:
#   1. Copy this file to `secrets.yaml` next to your reterminal-e1001.yaml or reterminal-e1002.yaml
#   2. Fill in your values
#   3. Never commit this file to git!
#
# Alternatively, you can paste the values directly into the YAML files instead of using !secret.
# That's simpler for beginners — just replace `!secret secret_name` with the actual value.

# ============================================================
# WiFi credentials (you can have multiple networks for fallback)
# ============================================================
wifi_ssid: "MyHomeNetwork"
wifi_password: "SuperSecureWiFi"
wifi_ssid2: "GuestNetwork"
wifi_password2: "GuestPassword"
wifi_ssid3: "MyHomeNetwork"
wifi_password3: "SuperSecureWiFi"

# ============================================================
# Dashboard URL (where the Make My Day server is running)
# ============================================================
# Replace with your server's address. Examples:
#   Local LAN:  http://192.168.1.100:7000/your-dashboard-id
#   Via Cloudflare tunnel: https://dashboard.example.com/your-dashboard-id
dashboard_base_url1: "http://192.168.1.100:7000/your-dashboard-id"
dashboard_base_url2: "http://192.168.1.100:7000/your-dashboard-id"

# ============================================================
# OTA (Over-The-Air) update password
# ============================================================
# Choose a strong password for remote updates via esphome
ota_password: "YourStrongOTAPassword"

# ============================================================
# API encryption key
# ============================================================
# Generate one with: esphome generate encryption-key reterminal-e1001.yaml
# (This is used for secure communication between ESPHome and the device)
api_encryption_key: "YOUR_API_ENCRYPTION_KEY_HERE"
